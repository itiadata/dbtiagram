name: _tmp-fix-lock

on:
  workflow_dispatch: {}

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CAFILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
