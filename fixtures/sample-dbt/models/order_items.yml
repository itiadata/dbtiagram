version: 2
models:
  - name: order_items
    description: One row per line item in an order
    columns:
      - name: order_item_id
        data_type: integer
      - name: order_id
        data_type: integer
        description: hola
      - name: customer_id
        data_type: integer
        description: hola
      - name: product_id
        data_type: integer
      - name: quantity
        data_type: integer
    constraints:
      - type: foreign_key
        columns: [order_id, customer_id]
        to: ref('orders')
        to_columns: [order_id, customer_id]
      - type: foreign_key
        columns: [product_id]
        to: ref('productos')
        to_columns: [product_id]
