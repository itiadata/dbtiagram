version: 2
models:
  - name: products
    description: One row per product
    config:
      meta:
        dbtiagram:
          virtual:
            primary_key:
              columns: [product_id]
            foreign_keys:
              - to: ref('customers')
                columns: [product_id]
                to_columns: [customer_id]
    columns:
      - name: product_id
        data_type: integer
      - name: name
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: new
        data_type: number
        description: jeje
